<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="30%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#311042" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="320" fill="url(#skyGrad)" />
  <circle cx="600" cy="120" r="280" fill="url(#glow)" filter="url(#blurFilter)" />
  <path d="M0,180 Q300,100 600,160 T1200,140 L1200,320 L0,320 Z" fill="url(#auroraGrad)" filter="url(#blurFilter)" opacity="0.4" />

  <!-- Distant Mountains -->
  <path d="M0,240 L150,190 L320,230 L500,170 L720,225 L900,180 L1080,220 L1200,195 L1200,320 L0,320 Z" fill="url(#mountainGrad)" />

  <!-- City Skyline / Columns Silhouette inspired by Notion landmark -->
  <rect x="420" y="110" width="16" height="150" fill="#2d3748" opacity="0.6" rx="2" />
  <rect x="760" y="110" width="16" height="150" fill="#2d3748" opacity="0.6" rx="2" />
  <polygon points="428,70 420,110 436,110" fill="#4a5568" opacity="0.8" />
  <polygon points="768,70 760,110 776,110" fill="#4a5568" opacity="0.8" />

  <!-- Classical Arch Structure in Center -->
  <path d="M480,240 L480,200 Q600,170 720,200 L720,240 Z" fill="#1e293b" opacity="0.8" />
  <rect x="470" y="210" width="260" height="10" fill="#334155" opacity="0.9" rx="2" />
  <line x1="510" y1="220" x2="510" y2="260" stroke="#475569" stroke-width="4" />
  <line x1="550" y1="220" x2="550" y2="260" stroke="#475569" stroke-width="4" />
  <line x1="590" y1="220" x2="590" y2="260" stroke="#475569" stroke-width="4" />
  <line x1="630" y1="220" x2="630" y2="260" stroke="#475569" stroke-width="4" />
  <line x1="670" y1="220" x2="670" y2="260" stroke="#475569" stroke-width="4" />

  <!-- Cherry Blossom Foliage & Tree Accents -->
  <g fill="#ec4899" opacity="0.65">
    <circle cx="120" cy="240" r="45" />
    <circle cx="170" cy="235" r="55" />
    <circle cx="230" cy="245" r="40" />
    <circle cx="280" cy="250" r="35" />
    <circle cx="340" cy="248" r="45" />
    <circle cx="860" cy="245" r="40" />
    <circle cx="920" cy="235" r="55" />
    <circle cx="980" cy="240" r="45" />
    <circle cx="1050" cy="245" r="50" />
    <circle cx="1120" cy="240" r="60" />
  </g>
  <g fill="#f472b6" opacity="0.5">
    <circle cx="140" cy="220" r="35" />
    <circle cx="200" cy="225" r="40" />
    <circle cx="900" cy="220" r="40" />
    <circle cx="960" cy="225" r="45" />
    <circle cx="1080" cy="220" r="35" />
  </g>

  <!-- Stars & Floating Tech Nodes -->
  <circle cx="100" cy="50" r="1.5" fill="#fff" opacity="0.8" />
  <circle cx="220" cy="70" r="1" fill="#fff" opacity="0.6" />
  <circle cx="340" cy="35" r="2" fill="#fff" opacity="0.9" />
  <circle cx="520" cy="55" r="1.5" fill="#fff" opacity="0.7" />
  <circle cx="680" cy="40" r="2" fill="#fff" opacity="0.8" />
  <circle cx="840" cy="65" r="1" fill="#fff" opacity="0.5" />
  <circle cx="980" cy="45" r="2" fill="#fff" opacity="0.9" />
  <circle cx="1100" cy="80" r="1.5" fill="#fff" opacity="0.6" />

  <!-- Bottom Gradient Overlay -->
  <rect y="260" width="1200" height="60" fill="url(#mountainGrad)" opacity="0.95" />
  
  <!-- Subtle Badge Text Overlay -->
  <text x="600" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="4" text-anchor="middle">FLYRANK AI CAPSTONE PORTFOLIO • INTERNSHIP SHOWCASE</text>
</svg>
